name: Rollback Daily Redesign

# Manual workflow to revert the most recent daily redesign commit.
# Use when today's design ships broken and you need to restore yesterday's
# working state without waiting for tomorrow's run.

on:
  workflow_dispatch:
    inputs:
      commits_back:
        description: 'How many commits back to roll mutable files to (default 1 = last redesign)'
        type: number
        default: 1

# Don't race with the daily redesign workflow — both modify main.
concurrency:
  group: daily-redesign
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50  # enough history to go back a few commits

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Roll back mutable files
        run: |
          N=${{ inputs.commits_back }}
          echo "Rolling back mutable files to HEAD~$N"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Restore only the AI-mutable files — leave everything else alone.
          #
          # Read the list from MUTABLE_FILES rather than repeating it here. The
          # hardcoded copy had drifted to 16 of the 18 entries: app/routes/og.tsx
          # and elements/chassis-preset.ts were never restored, so a rollback
          # left today's chassis preset and OG route standing against
          # yesterday's preset.ts — a combination no run ever produced or
          # validated. Anything added to MUTABLE_FILES is now covered here the
          # day it lands.
          mapfile -t FILES < <(node -e "import('./scripts/utils/site-context.js').then(m => console.log(m.MUTABLE_FILES.join('\n')))")
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::could not read MUTABLE_FILES — refusing to roll back a guessed file list"
            exit 1
          fi
          printf 'restoring %s\n' "${FILES[@]}"
          git checkout "HEAD~$N" -- "${FILES[@]}"

      # `pnpm build` is `panda codegen && ... && vite build`, so styled-system
      # is regenerated here rather than in a step of its own.
      - name: Verify build
        run: pnpm build

      - name: Commit and push
        run: |
          git add elements/ app/components/ app/routes/ styled-system/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "revert: roll back daily redesign (rollback workflow)"
          # Same guard as the nightly's push step: a for-loop's exit status is
          # its last command (sleep), so three failed pushes would report
          # success and leave the rollback sitting on the runner.
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              pushed=true
              break
            fi
            echo "push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::push failed after 3 attempts — rollback not on main"
            exit 1
          fi
