<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; padding: 0; }
    body { font-family: sans-serif; }
    /* 2026-09-05's field panel: a column that fits the phone, holding one
       word set far too large for it. No box moves; the word is cut. */
    .panel { width: 300px; overflow: hidden; }
    .shout { font-size: 200px; margin: 0; }
  </style>
</head>
<body>
  <div class="panel">
    <p class="shout">Shutout.</p>
  </div>
</body>
</html>
