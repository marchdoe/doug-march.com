<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doug March — No snowflake ever falls in the wrong place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-50:#ECFAEF; --green-100:#D2F4D9; --green-200:#A4E6B4;
    --green-300:#6FD38C; --green-400:#3DBB68; --green-500:#22A04F;
    --green-600:#178740; --green-700:#106E36; --green-800:#0E4A26; --green-900:#0A2E18;
    --sage-200:#CBD8CC; --muted:#8AA391;
    --text:#ECFAEF; --text-secondary:#CBD8CC;
    --accent:#3DBB68; --accent-glow:#A4E6B4;
    --strip:#0A2E18; --hairline:#178740;
    --pad-x:clamp(32px,6vw,96px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--green-800);
    color:var(--text);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    font-kerning:normal;
    min-height:100vh;
  }
  ::selection{background:var(--green-400);color:var(--green-900);}
  a{color:inherit;text-decoration:none;transition:color 150ms ease;}

  .page{
    display:grid;
    grid-template-rows:auto 1fr auto;
    min-height:100vh;
    min-height:100dvh;
    position:relative;
    overflow:hidden;
  }
  /* faint atmospheric verdure so the whole field breathes as one drench */
  .page::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(120% 90% at 88% 8%, rgba(34,160,79,0.28) 0%, rgba(14,74,38,0) 55%),
      radial-gradient(90% 80% at 12% 100%, rgba(10,46,24,0.55) 0%, rgba(14,74,38,0) 60%);
    pointer-events:none;
  }
  .page > *{position:relative;z-index:1;}

  /* ---- top row : corner mark + nav ---- */
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
    padding:clamp(28px,5vw,64px) var(--pad-x) 0;
  }
  .brand{
    display:inline-flex;
    align-items:center;
    color:var(--accent-glow);
    line-height:0;
  }
  .brand svg{
    width:auto;
    height:clamp(38px,4.4vw,52px);
    display:block;
  }
  .brand .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  nav{
    display:flex;
    gap:clamp(20px,2.6vw,40px);
    align-items:center;
    padding-top:6px;
  }
  nav a{
    font-family:"Manrope",sans-serif;
    font-size:16px;
    font-weight:500;
    color:var(--text-secondary);
    text-transform:lowercase;
    letter-spacing:0;
    padding:8px 2px;
    line-height:1;
  }
  nav a:hover{
    color:var(--accent-glow);
    text-decoration:underline;
    text-underline-offset:6px;
    text-decoration-thickness:1px;
  }

  /* ---- center band : the poster line ---- */
  .field{
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:clamp(40px,7vh,88px) var(--pad-x);
    min-height:78vh;
  }
  .hero{
    font-family:"Bricolage Grotesque","Manrope",sans-serif;
    font-weight:800;
    font-size:clamp(48px,8.5vw,132px);
    line-height:0.95;
    letter-spacing:-0.02em;
    color:var(--text);
    max-width:22ch;
    margin:0;
    text-wrap:balance;
  }
  .hero .snow{
    color:var(--accent-glow);
    text-shadow:0 0 32px rgba(164,230,180,0.35);
  }
  .credit{
    margin-top:clamp(28px,4vh,48px);
    font-family:"Manrope",sans-serif;
    font-size:14px;
    font-weight:500;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* ---- baseline data strip ---- */
  .strip{
    background:var(--strip);
    border-top:1px solid var(--hairline);
    padding:20px var(--pad-x);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px 28px;
    font-family:"Manrope",sans-serif;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--sage-200);
    font-variant-numeric:tabular-nums;
  }
  .strip .item{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;}
  .strip .sep{color:var(--hairline);}
  .strip .win{color:var(--accent);}
  .strip .loss{color:var(--muted);}
  .strip .music{letter-spacing:0.12em;}
  .strip .moon-dot{
    color:var(--accent-glow);
    font-size:11px;
    text-shadow:0 0 10px rgba(164,230,180,0.7);
  }
  .strip .lbl{color:var(--muted);}

  @media (max-width:640px){
    header{flex-direction:column;gap:20px;}
    nav{padding-top:0;gap:22px;}
    .hero{font-size:clamp(40px,12vw,72px);max-width:none;}
    .field{min-height:70vh;}
    .strip{font-size:11.5px;gap:10px 18px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;}
  }
</style>
</head>
<body>

        <span class="sr">Doug March</span>
      </a>
      <nav aria-label="Primary">
        <a href="/work">work</a>
        <a href="/about">about</a>
        <a href="/contact">contact</a>
      </nav>
    </header>

    <main class="field">
      <h1 class="hero">No <span class="snow">snowflake</span> ever falls in the wrong place.</h1>
      <p class="credit">— Zen Proverb</p>

    <footer class="strip" aria-label="Today's signals">
