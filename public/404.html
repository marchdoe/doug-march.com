<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — dougmar.ch</title>
<meta name="robots" content="noindex">
<style>
  /* Deliberately static. This page owns every value it renders and reads no
     design token, so a broken nightly preset cannot take it down with the rest
     of the site. Same reasoning as the archive frame in scripts/utils/archive-seal.js.
     See issue #199. */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0e0e10;
    color:#f4f4f5;
    font:400 16px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    letter-spacing:.01em;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
  }
  main{width:100%;max-width:34rem}
  .code{
    font-variant-numeric:tabular-nums;
    font-size:clamp(3.5rem,12vw,6rem);
    font-weight:600;
    line-height:1;
    letter-spacing:-.03em;
    color:#f4f4f5;
  }
  hr{border:0;border-top:1px solid rgba(255,255,255,.14);margin:28px 0}
  h1{
    font-size:clamp(1.125rem,3.4vw,1.5rem);
    font-weight:500;
    line-height:1.3;
    letter-spacing:-.01em;
    margin-bottom:14px;
  }
  p{color:rgba(244,244,245,.62);max-width:30rem}
  .go{
    display:inline-block;
    margin-top:32px;
    color:#f4f4f5;
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,.34);
    padding-bottom:2px;
    transition:border-color 120ms ease;
  }
  .go:hover{border-bottom-color:#f4f4f5}
  @media (max-width:480px){body{padding:24px}hr{margin:22px 0}}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <hr>
  <h1>The only page here that never changes.</h1>
  <p>Nothing lives at this address. Everything else on this site was redesigned last night.</p>
  <a class="go" href="/archive">See what did &rarr;</a>
</main>
</body>
</html>
